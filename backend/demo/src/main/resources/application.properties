spring.application.name=sala-livre

# 1. Configuração do Servidor (API)
server.port=8080

# 2. Configuração do Banco de Dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sala_livre?useSSL=false&serverTimezone=UTC

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}


# O banco foi criado manualmente.
# Por enquanto, o Hibernate NÃO deve criar ou alterar tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Exibe no console os comandos SQL executados
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET}